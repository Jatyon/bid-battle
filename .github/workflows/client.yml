name: Client CI

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-ci:
    name: client-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for client changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'client/**'

      - name: Setup Node.js
        if: steps.filter.outputs.client == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.client == 'true'
        run: npm ci

      - name: Cache Playwright Browsers
        if: steps.filter.outputs.client == 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install Playwright Chromium with system dependencies
        if: steps.filter.outputs.client == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.filter.outputs.client == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Lint Client
        if: steps.filter.outputs.client == 'true'
        run: npm run lint

      - name: Typecheck Client
        if: steps.filter.outputs.client == 'true'
        run: npm run typecheck

      - name: Test Client
        if: steps.filter.outputs.client == 'true'
        run: npm run test -- --watch=false

      - name: Cache Angular build cache
        if: steps.filter.outputs.client == 'true'
        uses: actions/cache@v6
        with:
          path: client/.angular/cache
          key: ${{ runner.os }}-angular-build-${{ hashFiles('client/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-build-${{ hashFiles('client/package-lock.json') }}-
            ${{ runner.os }}-angular-build-

      - name: Build Client (Production)
        if: steps.filter.outputs.client == 'true'
        run: npm run build -- --configuration=production

      - name: Log Skipped Status
        if: steps.filter.outputs.client != 'true'
        run: echo "No changes detected in client directory. Status check passed."
