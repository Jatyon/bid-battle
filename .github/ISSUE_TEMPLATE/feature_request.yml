name: 💡 Feature Request
description: Suggest an idea or capability for BidBattle
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much context as possible.
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which part of the platform will this feature impact?
      options:
        - Frontend (Angular SSR)
        - Backend API (NestJS)
        - WebSocket / Real-time Bidding
        - Infrastructure / Database
        - Background Jobs / Queues
        - Developer Experience
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds considered?
