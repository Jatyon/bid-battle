name: 🐛 Bug Report
description: Create a report to help us improve BidBattle
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the platform is affected?
      options:
        - Frontend (Angular SSR)
        - Backend API (NestJS)
        - WebSocket / Real-time Bidding
        - Database / Redis / Migrations
        - Background Workers (BullMQ)
        - DevOps / Docker / CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs or terminal output here.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Environment & Verification
      options:
        - label: I am running Node.js 22.x
          required: true
        - label: I have verified this is not a duplicate issue
          required: true
